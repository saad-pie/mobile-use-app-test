name: Mobile-Use Agent with Antigravity LLM

on:
  workflow_dispatch:
    inputs:
      task_instruction:
        description: 'Natural language task for the mobile agent'
        required: true
        default: 'Turn on Bluetooth and WiFi'
      model_name:
        description: 'Antigravity Model ID to use'
        required: true
        default: 'gemini-3.5-flash'

jobs:
  run-mobile-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone and Install mobile-use Globally
        run: |
          git clone https://github.com/MadeAgents/mobile-use.git
          cd mobile-use
          pip install --upgrade pip
          pip install -e .

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'cmdline-tools;latest' | sdkmanager --licenses || true
          sudo chown $USER /dev/kvm

      - name: Start Android Emulator and Execute Mobile-Use Agent
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            echo "📱 Emulator booted successfully! Checking ADB..."
            adb devices
            echo "🚀 Running mobile-use agent with Antigravity provider..."
            
            cd mobile-use
            
            # Write python script to an external file to completely avoid shell quote parsing issues
            cat << 'EOF' > run_agent.py
            import yaml
            import os
            import mobile_use

            config_path = 'configs/mobileuse.yaml'
            with open(config_path, 'r') as f:
                cfg = yaml.safe_load(f)

            cfg['env']['serial_no'] = 'emulator-5554'
            cfg['vlm']['api_key'] = os.environ.get('VLM_API_KEY', 'antigravity-free')
            cfg['vlm']['base_url'] = os.environ.get('VLM_BASE_URL', 'https://antigravity-seven-delta.vercel.app/v1')
            cfg['vlm']['model_name'] = os.environ.get('VLM_MODEL', 'gemini-3.5-flash')

            with open(config_path, 'w') as f:
                yaml.dump(cfg, f)

            agent = mobile_use.Agent.from_params({'type': 'MultiAgent', 'config_path': config_path})
            goal = os.environ.get('TASK_INSTRUCTION', 'Turn on Bluetooth and WiFi')
            agent.set_max_steps(10)

            print(f'🎯 Target Task: {goal}')
            print(f'🧠 Target Model: {cfg["vlm"]["model_name"]}')
            print('🤖 Starting agent execution...')
            agent.run(input_content=goal)
            EOF

            python3 run_agent.py
        env:
          OPENAI_API_KEY: "antigravity-free"
          OPENAI_BASE_URL: "https://antigravity-seven-delta.vercel.app/v1"
          VLM_API_KEY: "antigravity-free"
          VLM_BASE_URL: "https://antigravity-seven-delta.vercel.app/v1"
          VLM_MODEL: "${{ github.event.inputs.model_name }}"
          TASK_INSTRUCTION: "${{ github.event.inputs.task_instruction }}"
          
