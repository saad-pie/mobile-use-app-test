name: Mobile-Use Agent with Antigravity LLM

on:
  workflow_dispatch:
    inputs:
      task_instruction:
        description: 'Natural language task for the mobile agent'
        required: true
        default: 'Turn on Bluetooth and WiFi'
      model_name:
        description: 'Antigravity Model ID to use'
        required: true
        default: 'gemini-3.5-flash'

jobs:
  run-mobile-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone and Install mobile-use Globally
        run: |
          git clone https://github.com/MadeAgents/mobile-use.git
          cd mobile-use
          pip install --upgrade pip
          pip install -e .

      - name: Create Bulletproof Execution Script
        run: |
          # Write the python execution script using absolute paths to prevent any FileNotFoundError
          cat << 'EOF' > run_agent.py
          import os
          import sys

          # Determine absolute paths dynamically
          workspace_root = os.getcwd()
          mobile_use_dir = os.path.join(workspace_root, 'mobile-use')
          sys.path.append(mobile_use_dir)

          import mobile_use
          
          # Use absolute path for the configuration file
          config_path = os.path.join(mobile_use_dir, 'config', 'mobileuse.yaml')
          
          print(f"📂 Workspace Root: {workspace_root}")
          print(f"📄 Resolved Config Path: {config_path}")
          
          if not os.path.exists(config_path):
              raise FileNotFoundError(f"Critical Error: Config file not found at {config_path}")

          agent = mobile_use.Agent.from_params(dict(
              type='MultiAgent',
              config_path=config_path,
          ))
          
          goal = os.getenv('AGENT_GOAL', 'Turn on Bluetooth and WiFi')
          agent.set_max_steps(10)
          
          print(f"🎯 Target Task: {goal}")
          print("🤖 Starting agent execution...")
          agent.run(input_content=goal)
          EOF

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'cmdline-tools;latest' | sdkmanager --licenses || true
          sudo chown $USER /dev/kvm

      - name: Start Android Emulator and Execute Mobile-Use Agent
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          correlate-boot-logs: true
          script: |
            echo "📱 Emulator booted successfully! Checking ADB..."
            adb devices

            echo "🚀 Running mobile-use agent with Antigravity provider..."
            python run_agent.py
        env:
          OPENAI_API_KEY: "antigravity-free"
          OPENAI_BASE_URL: "https://antigravity-seven-delta.vercel.app/v1"
          VLM_API_KEY: "antigravity-free"
          VLM_BASE_URL: "https://antigravity-seven-delta.vercel.app/v1"
          MODEL_NAME: "${{ github.event.inputs.model_name }}"
          AGENT_GOAL: "${{ github.event.inputs.task_instruction }}"
          
